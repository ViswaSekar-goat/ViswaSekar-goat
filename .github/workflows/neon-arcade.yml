name: Generate Constellation Contribution Graph

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/neon-arcade.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Checkout contribution-gallery renderer
        uses: actions/checkout@v4
        with:
          repository: crosscore/contribution-gallery
          ref: main
          path: contribution-gallery

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contribution-gallery/package-lock.json

      - name: Install renderer dependencies
        working-directory: contribution-gallery
        run: npm ci

      - name: Keep only the Constellation scene
        working-directory: contribution-gallery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/renderer/scenes/index.ts")
          s = p.read_text()
          old = "export const SCENES: Scene[] = [plasma, constellation, tide, aurora, pathfinder, life, sort, pong, fireworks, ripples];"
          new = "export const SCENES: Scene[] = [constellation];"
          if old not in s:
              raise SystemExit("Could not find the expected SCENES declaration; refusing to modify an unknown renderer version.")
          p.write_text(s.replace(old, new))
          PY

      - name: Generate animated constellation SVG from real contributions
        working-directory: contribution-gallery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ../dist
          npx tsx src/cli.ts --user "${{ github.repository_owner }}" --mode ambient --dark --output ../dist/constellation-dark.svg

      - name: Publish SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
